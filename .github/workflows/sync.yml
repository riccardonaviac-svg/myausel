name: Sincronizar Mercado Libre
on:
  schedule:
    - cron: "17 * * * *" # cada hora
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync.mjs
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
      - name: Guardar refresh token nuevo
        if: always() && hashFiles('.new_refresh_token') != ''
        run: gh secret set ML_REFRESH_TOKEN < .new_refresh_token && rm .new_refresh_token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
      - name: Publicar cambios
        run: |
          git diff --quiet products.json && exit 0
          git config user.name "ausel-bot"
          git config user.email "ausel-bot@users.noreply.github.com"
          git commit -am "Actualizar productos desde Mercado Libre"
          git push
